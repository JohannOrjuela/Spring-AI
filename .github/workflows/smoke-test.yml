name: Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Start services
        run: | 
          docker compose -f docker/docker-compose.yml up -d --build || true
      - name: Wait and run smoke test
        run: |
          sleep 10
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down --volumes || true
