<div class="chat">
  <div class="messages">
    <div *ngFor="let m of messages" class="message" [ngClass]="m.from">
      <strong>{{m.from}}:</strong> {{m.text}}
    </div>
  </div>

  <div class="controls">
    <input [(ngModel)]="input" (keyup.enter)="send()" placeholder="Type your question" />
    <button (click)="send()" [disabled]="loading">Send</button>
  </div>
</div>
