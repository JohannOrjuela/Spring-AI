<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PruebaChat — consola local</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper:   #E9ECE8;
    --surface: #FCFDFB;
    --ink:     #14181A;
    --muted:   #6A736E;
    --line:    #C9CFC9;
    --ok:      #2E6B4F;
    --err:     #B03A2E;
    --wait:    #8A6A1F;

    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }

  .shell {
    width: 100%;
    max-width: 720px;
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---- Barra de diagnóstico: modelo, endpoint y alcanzabilidad ---- */
  .rail {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .rail h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .rail .probe {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .dot[data-state="up"]      { background: var(--ok); }
  .dot[data-state="down"]    { background: var(--err); }
  .dot[data-state="probing"] { background: var(--wait); }

  /* ---- Transcripción ---- */
  .transcript {
    flex: 1;
    min-height: 340px;
    max-height: 58vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 4px 2px;
  }
  .empty {
    margin: auto;
    max-width: 34ch;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  .turn { display: flex; flex-direction: column; gap: 4px; }
  .turn .who {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .turn .body {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
  }
  .turn[data-who="user"] { align-items: flex-end; }
  .turn[data-who="user"] .body {
    background: transparent;
    border-style: dashed;
  }
  .turn[data-who="fault"] .body {
    border-color: var(--err);
    color: var(--err);
  }

  /* Sello de diagnóstico por turno: latencia real y estado devuelto */
  .stamp {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .stamp b { font-weight: 600; color: var(--ink); }

  .contract {
    display: grid;
    gap: 4px;
    margin-top: 6px;
    padding: 8px 10px;
    border-left: 3px solid var(--ok);
    background: #F3F6F3;
    font-family: var(--mono);
    font-size: 10.5px;
  }
  .contract-row {
    display: grid;
    grid-template-columns: minmax(125px, 0.35fr) 1fr;
    gap: 10px;
  }
  .contract-key { color: var(--muted); }
  .contract-value { color: var(--ink); overflow-wrap: anywhere; }

  /* ---- Composición ---- */
  .composer { display: flex; flex-direction: column; gap: 10px; }
  .composer-row { display: flex; gap: 8px; }
  .composer-row input {
    flex: 1;
    min-width: 0;
    padding: 11px 13px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  .composer-row input::placeholder { color: var(--muted); }
  .composer button {
    padding: 11px 20px;
    font: inherit;
    font-weight: 600;
    color: var(--surface);
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 3px;
    cursor: pointer;
  }
  .composer button:hover:not(:disabled) { background: #2C3436; }
  .composer button:disabled,
  .composer input:disabled { opacity: 0.5; cursor: not-allowed; }

  .sampling {
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: rgba(252, 253, 251, 0.55);
  }
  .sampling summary {
    cursor: pointer;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
  }
  .sampling-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 9px;
    margin-top: 10px;
  }
  .sampling-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10.5px;
  }
  .sampling-field input {
    width: 100%;
    padding: 8px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: var(--mono);
  }
  .sampling-help {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 11px;
  }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    min-height: 1.4em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 640px) {
    .sampling-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<main class="shell">

  <div class="rail">
    <h1>PruebaChat</h1>
    <span class="probe">
      <span class="dot" id="dot" data-state="probing"></span>
      <span id="probe-text">comprobando el modelo…</span>
    </span>
  </div>

  <div class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Conversación">
    <p class="empty" id="empty">Escribe una pregunta para enviarla al modelo que corre en Ollama.</p>
  </div>

  <form class="composer" id="composer">
    <details class="sampling" id="sampling">
      <summary>Parámetros de muestreo (opcionales)</summary>
      <div class="sampling-grid">
        <label class="sampling-field">temperature · 0–2
          <input id="temperature" type="number" min="0" max="2" step="0.1" placeholder="default">
        </label>
        <label class="sampling-field">topP · 0–1
          <input id="topP" type="number" min="0" max="1" step="0.05" placeholder="default">
        </label>
        <label class="sampling-field">topK · 0–200
          <input id="topK" type="number" min="0" max="200" step="1" placeholder="default">
        </label>
        <label class="sampling-field">numPredict · 1–2048
          <input id="numPredict" type="number" min="1" max="2048" step="1" placeholder="default">
        </label>
        <label class="sampling-field">seed · entero
          <input id="seed" type="number" min="-2147483648" max="2147483647" step="1" placeholder="default">
        </label>
      </div>
      <p class="sampling-help">Deja un campo vacío para conservar el valor predeterminado de Ollama.</p>
    </details>
    <div class="composer-row">
      <label for="input" class="sr-only" hidden>Pregunta</label>
      <input id="input" autocomplete="off" placeholder="Escribe tu pregunta" required>
      <button type="submit" id="send">Enviar</button>
    </div>
  </form>

  <p class="hint" id="hint"></p>

</main>

<script>
(() => {
  "use strict";

  // Configurable sin recompilar: define window.PRUEBACHAT_API antes de este script
  // (o mediante una variable inyectada en el contenedor) para apuntar a otro host.
  const API = (window.PRUEBACHAT_API || "http://localhost:8080").replace(/\/$/, "");

  // Debe ser >= spring.http.client.read-timeout del backend. Una inferencia de
  // llama3 en CPU puede tardar minutos la primera vez.
  const TIMEOUT_MS = 180000;

  // sessionId estable por pestaña: el backend ya lo acepta y lo registra en logs.
  const SESSION_ID = (crypto.randomUUID?.() || String(Date.now()));

  const $transcript = document.getElementById("transcript");
  const $empty      = document.getElementById("empty");
  const $form       = document.getElementById("composer");
  const $input      = document.getElementById("input");
  const $send       = document.getElementById("send");
  const $hint       = document.getElementById("hint");
  const $dot        = document.getElementById("dot");
  const $probeText  = document.getElementById("probe-text");
  const samplingInputs = {
    temperature: document.getElementById("temperature"),
    topP: document.getElementById("topP"),
    topK: document.getElementById("topK"),
    numPredict: document.getElementById("numPredict"),
    seed: document.getElementById("seed")
  };

  /* ---------- Render ---------- */

  function addTurn(who, label, text, stamp, contract) {
    $empty?.remove();

    const turn = document.createElement("div");
    turn.className = "turn";
    turn.dataset.who = who;

    const head = document.createElement("span");
    head.className = "who";
    head.textContent = label;

    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;          // textContent, nunca innerHTML: evita inyección

    turn.append(head, body);

    if (stamp) {
      const s = document.createElement("span");
      s.className = "stamp";
      s.innerHTML = stamp;            // solo cadenas construidas aquí, sin datos del modelo
      turn.append(s);
    }

    if (contract) {
      const panel = document.createElement("div");
      panel.className = "contract";
      ["requestId", "answer", "elapsedMs", "status", "promptTokens", "completionTokens",
        "totalTokens", "model", "finishReason", "tokensPerSecond", "errors"].forEach((key) => {
        const row = document.createElement("div");
        row.className = "contract-row";
        const name = document.createElement("span");
        name.className = "contract-key";
        name.textContent = key;
        const value = document.createElement("code");
        value.className = "contract-value";
        value.textContent = contract[key] === null || contract[key] === undefined
          ? "null"
          : typeof contract[key] === "object" ? JSON.stringify(contract[key]) : String(contract[key]);
        row.append(name, value);
        panel.append(row);
      });
      turn.append(panel);
    }

    $transcript.append(turn);
    $transcript.scrollTop = $transcript.scrollHeight;
    return turn;
  }

  function setBusy(busy) {
    $input.disabled = busy;
    Object.values(samplingInputs).forEach((input) => input.disabled = busy);
    $send.disabled = busy;
    $send.textContent = busy ? "Generando…" : "Enviar";
    $hint.textContent = busy ? "El modelo está respondiendo. Puede tardar en la primera consulta." : "";
  }

  /* ---------- Salud del modelo (usa /health/llm del backend) ---------- */

  async function probe() {
    $dot.dataset.state = "probing";
    $probeText.textContent = "comprobando el modelo…";
    try {
      const res = await fetch(`${API}/health/llm`, { signal: AbortSignal.timeout(8000) });
      const data = await res.json().catch(() => null);
      if (res.ok && data?.ok) {
        const models = data.result?.models;
        const names = Array.isArray(models) ? models.map(m => m.name).filter(Boolean) : [];
        $dot.dataset.state = "up";
        $probeText.textContent = names.length
          ? `ollama activo · ${names.join(", ")}`
          : "ollama activo · sin modelos descargados";
      } else {
        $dot.dataset.state = "down";
        $probeText.textContent = "ollama no responde";
      }
    } catch {
      $dot.dataset.state = "down";
      $probeText.textContent = `backend inalcanzable en ${API}`;
    }
  }

  /* ---------- Envío ---------- */

  function readSamplingOptions() {
    return Object.fromEntries(Object.entries(samplingInputs)
      .filter(([, input]) => input.value !== "")
      .map(([name, input]) => [name, Number(input.value)]));
  }

  async function ask(question, samplingOptions) {
    const started = performance.now();
    setBusy(true);

    try {
      const res = await fetch(`${API}/api/v1/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, sessionId: SESSION_ID, ...samplingOptions }),
        signal: AbortSignal.timeout(TIMEOUT_MS)
      });

      const data = await res.json().catch(() => null);
      const roundTrip = Math.round(performance.now() - started);

      // El backend responde 502 con status "error" cuando el modelo no devuelve texto.
      if (!res.ok) {
        addTurn("fault", "error", `El backend respondió HTTP ${res.status}.` +
          (data?.status ? ` status=${data.status}` : "") +
          " Revisa los logs del contenedor pruebachat_backend.", null, data);
        return;
      }

      // Comprobación explícita: "" es falsy, así que nunca usar answer || otraCosa.
      const answer = typeof data?.answer === "string" ? data.answer : "";

      if (data?.status !== "ok" || answer.trim() === "") {
        addTurn("fault", "respuesta vacía",
          "El backend contestó correctamente pero sin texto. Suele significar que el modelo " +
          "no está descargado en Ollama o que agotó el presupuesto de tokens.", null, data);
        return;
      }

      addTurn("bot", "modelo", answer,
        `<b>${data.elapsedMs} ms</b> en el modelo · ${roundTrip} ms total · ${data.requestId}`, data);

    } catch (err) {
      const msg = err?.name === "TimeoutError"
        ? `Sin respuesta tras ${TIMEOUT_MS / 1000} s. El modelo puede seguir cargándose en memoria.`
        : `No se pudo contactar el backend en ${API}. ¿Está levantado el contenedor?`;
      addTurn("fault", "error", msg);
    } finally {
      setBusy(false);
      $input.focus();
      probe();
    }
  }

  $form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = $input.value.trim();
    if (!question) return;
    const samplingOptions = readSamplingOptions();
    const samplingStamp = Object.keys(samplingOptions).length
      ? Object.entries(samplingOptions).map(([name, value]) => `${name}=${value}`).join(" · ")
      : "defaults de Ollama";
    addTurn("user", "tú", question, samplingStamp);
    $input.value = "";
    ask(question, samplingOptions);
  });

  probe();
  $input.focus();
})();
</script>
</body>
</html>
